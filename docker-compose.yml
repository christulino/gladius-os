# Gladius — one-shot install stack
# Pulls the published app image + PostgreSQL. No source checkout required.
#
# Install:
#   curl -O https://raw.githubusercontent.com/christulino/gladius-os/main/docker-compose.yml
#   docker compose up
#
# Then open http://localhost:3000/admin/ — the generated admin password prints
# in the app container logs on first boot. Add your Anthropic API key later
# under Settings -> AI Models to enable playbooks and NL search.
#
# Reset (destroys all data + regenerates secrets):
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       gladius
      POSTGRES_USER:     gladius
      POSTGRES_PASSWORD: gladius
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gladius -d gladius"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/christulino/gladius-os:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              "3000"
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       gladius
      POSTGRES_USER:     gladius
      POSTGRES_PASSWORD: gladius
      GLADIUS_MULTI_ORG: "false"
    ports:
      - "3000:3000"
    volumes:
      - gladius_data:/data

volumes:
  postgres_data:
  gladius_data:
